<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>wiring check — stock-trader-portfolio</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 40rem; padding: 0 1rem; line-height: 1.6; }
  h1 { font-size: 1.1rem; color: #b45309; }
  pre { background: #f4f4f5; padding: 1rem; border-radius: 6px; overflow-x: auto; }
  .ok { color: #15803d; } .ng { color: #b91c1c; }
</style>
</head>
<body>
<h1>PLACEHOLDER — WIRING CHECK ONLY</h1>
<p>この仮ページは GitHub Pages の配線確認用です。実ページに差し替えたら消えます。
表示されているデータはすべて<strong>合成値</strong>で、実際の取引記録ではありません。</p>

<h2>fetch 結果</h2>
<pre id="out">loading…</pre>

<script>
  // 相対パス。先頭に / を付けない（project site は /stock-trader-portfolio/ 配下で配信される）
  fetch('data/portfolio.json?t=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
    .then(function (j) {
      var el = document.getElementById('out');
      el.className = 'ok';
      el.textContent =
        'FETCH OK\n' +
        'schema_version = ' + j.schema_version + '\n' +
        'generated_at   = ' + j.generated_at + '\n' +
        'detail_level   = ' + j.detail_level + '\n' +
        'market         = ' + j.market + '\n' +
        'source         = ' + j.source + '\n' +
        'valuation_available = ' + j.valuation_available + '\n' +
        'positions      = ' + (j.positions ? j.positions.length : '(key absent)') + '\n' +
        'equity_curve   = ' + (j.equity_curve ? j.equity_curve.length : '(key absent)') + '\n' +
        'benchmarks     = ' + (j.benchmarks ? j.benchmarks.length : '(key absent)') + '\n' +
        'notes          = ' + JSON.stringify(j.notes);
    })
    .catch(function (e) {
      var el = document.getElementById('out');
      el.className = 'ng';
      el.textContent = 'FETCH FAILED: ' + e.message;
    });
</script>
</body>
</html>
